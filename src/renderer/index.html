<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Main Window</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }
      button {
        padding: 10px 20px;
        font-size: 16px;
      }
      #log {
        margin-top: 20px;
        white-space: pre-wrap;
        background: #f0f0f0;
        padding: 10px;
        height: 200px;
        overflow-y: auto;
        border: 1px solid #ccc;
      }
    </style>
  </head>
  <body>
    <h1>Main Window</h1>
    <button id="toggleOverlayBtn">Toggle Overlay</button>

    <div id="log"></div>

    <script>
      const logDiv = document.getElementById('log');
      const toggleBtn = document.getElementById('toggleOverlayBtn');

      // Log üzenetek megjelenítése
      window.electronAPI.onConsoleMessage((event, message, ...args) => {
        logDiv.textContent += message + ' ' + args.join(' ') + '\n';
        logDiv.scrollTop = logDiv.scrollHeight;
      });

      // Toggle gomb kattintás
      toggleBtn.addEventListener('click', () => {
        window.electronAPI.toggleOverlay();
      });
    </script>
  </body>
</html>
